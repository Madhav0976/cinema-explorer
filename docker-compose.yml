services:
  postgres:
    image: postgres:16-alpine
    container_name: cinema_explorer_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Development defaults - update or override via environment in production
      POSTGRES_DB: cinema_explorer
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local

